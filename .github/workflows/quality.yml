name: Quality

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python source
        run: python -m compileall -q app.py accessible_analyzer tests
